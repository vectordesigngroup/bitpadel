<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Court booking</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <p>Club box</p>
    <nav>
      <a href="/" aria-current="page">Booking</a>
      <a href="/kiosk">Door kiosk</a>
      <a href="/account">My bookings</a>
      <a href="/admin">Admin</a>
    </nav>
  </header>
  <main>
    <h1>Book a court</h1>
    <p class="note">Prices follow the club's rules. Log in on <a href="/account">your bookings</a> with the email on a membership to get the member price.</p>
    <fieldset id="pay-with">
      <legend>Pay with</legend>
      <label><input type="radio" name="method" value="lightning" checked> Lightning</label>
    </fieldset>
    <label>Receipt email, optional
      <input id="receipt-email" type="email" maxlength="200" autocomplete="email">
    </label>
    <label><input id="reminder-email" type="checkbox"> Email me a reminder before this booking</label>
    <label>Reminder phone, only if you want a text
      <input id="reminder-phone" type="tel" maxlength="32" autocomplete="tel">
    </label>
    <label><input id="reminder-sms" type="checkbox"> Text me a reminder. This is not marketing.</label>
    <div id="courts" class="row"></div>
    <div id="slots"></div>
    <section id="invoice" hidden>
      <h2 id="invoice-title">Lightning invoice</h2>
      <p id="invoice-note"></p>
      <img id="invoice-qr" alt="Invoice QR" width="280" height="280">
      <p id="invoice-amount"></p>
      <p id="bolt11" class="mono"></p>
      <p id="invoice-status" role="status"></p>
    </section>
    <p id="status" class="status" role="status"></p>
  </main>
  <footer>
    <p>Reference app. Replace the placeholder colors with your club's brand.</p>
  </footer>
  <script src="/booking.js"></script>
</body>
</html>
