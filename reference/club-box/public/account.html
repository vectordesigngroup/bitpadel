<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My bookings</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/brand.css">
</head>
<body>
  <header>
    <p class="brand-name"><img class="brand-logo" alt="" hidden><span class="brand-name-text">Your club</span></p>
    <nav>
      <a href="/">Booking</a>
      <a href="/account" aria-current="page">My bookings</a>
      <a href="/kiosk">Door kiosk</a>
      <a href="/admin">Admin</a>
    </nav>
  </header>
  <main>
    <h1>My bookings</h1>
    <p class="note">A login code arrives by email. It is not a marketing message. Cancel only inside the club's window.</p>
    <p id="status" class="status" role="status"></p>
    <form id="code-form" class="card">
      <label>Email
        <input name="email" type="email" required maxlength="200" autocomplete="email">
      </label>
      <button type="submit">Email me a code</button>
    </form>
    <form id="session-form" class="card">
      <label>Code
        <input name="code" required maxlength="12" inputmode="numeric" autocomplete="one-time-code">
      </label>
      <button type="submit">Log in</button>
    </form>
    <section id="bookings" hidden>
      <h2>Upcoming</h2>
      <div id="upcoming"></div>
      <h2>Past</h2>
      <div id="past"></div>
    </section>
  </main>
  <footer class="brand-footer">
    <p class="brand-footer-text">This look is a placeholder. Give your club its own name and logo. The BitPadel name and logo are not your club's brand.</p>
    <p class="brand-contact"></p>
    <p class="brand-links"></p>
  </footer>
  <script src="/brand.js"></script>
  <script src="/account.js"></script>
</body>
</html>
