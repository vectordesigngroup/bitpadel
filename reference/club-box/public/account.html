<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My bookings</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <p>Club box</p>
    <nav>
      <a href="/">Booking</a>
      <a href="/account" aria-current="page">My bookings</a>
      <a href="/kiosk">Door kiosk</a>
      <a href="/admin">Admin</a>
    </nav>
  </header>
  <main>
    <h1>My bookings</h1>
    <p class="note">A login code arrives by email. It is not a marketing message. Cancel only inside the club's window.</p>
    <p id="status" class="status" role="status"></p>
    <form id="code-form" class="card">
      <label>Email
        <input name="email" type="email" required maxlength="200" autocomplete="email">
      </label>
      <button type="submit">Email me a code</button>
    </form>
    <form id="session-form" class="card">
      <label>Code
        <input name="code" required maxlength="12" inputmode="numeric" autocomplete="one-time-code">
      </label>
      <button type="submit">Log in</button>
    </form>
    <section id="bookings" hidden>
      <h2>Upcoming</h2>
      <div id="upcoming"></div>
      <h2>Past</h2>
      <div id="past"></div>
    </section>
  </main>
  <script src="/account.js"></script>
</body>
</html>
