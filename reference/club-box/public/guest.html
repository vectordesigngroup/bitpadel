<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guest</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/brand.css">
</head>
<body>
  <header>
    <p class="brand-name"><img class="brand-logo" alt="" hidden><span class="brand-name-text">Your club</span></p>
    <nav>
      <a href="/">Booking</a>
      <a href="/privacy">Privacy</a>
    </nav>
  </header>
  <main>
    <h1>Guest check-in</h1>
    <p class="note">The club keeps the name and contact so staff know who is on site. Marketing is a separate choice.</p>
    <p id="status" class="status" role="status"></p>
    <form id="guest" class="card">
      <label>Name
        <input name="displayName" required maxlength="80">
      </label>
      <label>Contact
        <select name="contactKind">
          <option value="email">Email</option>
          <option value="phone">Phone</option>
        </select>
      </label>
      <label>Email or phone
        <input name="contactValue" required maxlength="200">
      </label>
      <label><input name="waiverAccepted" type="checkbox" required> I acknowledge the club waiver for this visit.</label>
      <label><input name="marketingConsent" type="checkbox"> Send me club news. Leave this unchecked if you do not want that.</label>
      <button type="submit">Add guest</button>
    </form>
  </main>
  <footer class="brand-footer">
    <p class="brand-footer-text">This look is a placeholder. Give your club its own name and logo. The BitPadel name and logo are not your club's brand.</p>
    <p class="brand-contact"></p>
    <p class="brand-links"></p>
  </footer>
  <script src="/brand.js"></script>
  <script src="/guest.js"></script>
</body>
</html>
